name: Buffer publish

on:
  push:
    branches: [prod]
    paths:
      - src/data/courses.json
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug d'une course a republier (vide = courses ajoutees par le push)"
        required: false
        type: string

concurrency:
  group: buffer-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Buffer drafts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_BASE_SHA: ${{ github.event.before }}
          BUFFER_SLUG: ${{ inputs.slug }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: node scripts/publish-to-buffer.js
